[package]
name    = "korvo-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Embassy async runtime --------------------------------------------------
embassy-executor = "0.10"
embassy-futures  = "0.1"
embassy-sync     = "0.8"
embassy-time     = "0.5"
embassy-usb      = { version = "0.6", default-features = false, optional = true }
embassy-usb-host = { path = "/home/nws/w/esp32/embassy-usb-host/embassy-usb-host", optional = true }
embassy-usb-driver = "0.2.2"
embassy-usb-synopsys-otg = { version = "0.4", optional = true }
log = { version = "0.4", default-features = false, optional = true }

# esp-rs stack ------------------------------------------------------------
# esp-hal stable (1.2.x) does not contain ESP32-S31 support yet: the I2S,
# LCD_CAM (RGB panel + DVP camera) and USB-HS drivers for this chip live on
# `main` and are expected in the next minor release. Pin everything to the
# same revision of the esp-hal repository so the intra-repo crates stay
# compatible.
esp-hal = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-hal", features = ["esp32s31", "unstable"] }
esp-backtrace = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-backtrace", features = ["esp32s31", "panic-handler", "println"] }
esp-bootloader-esp-idf = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-bootloader-esp-idf", features = ["esp32s31"] }
esp-rtos = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-rtos", features = ["esp32s31", "embassy"] }
esp-println = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-println", default-features = false, features = ["esp32s31", "uart", "critical-section"] }
esp-alloc = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-alloc", default-features = false, features = ["esp32s31", "compat"] }

# SD/MMC card protocol + FAT filesystem -----------------------------------
sdio                = "0.5"
block-device-driver = "0.2"
aligned             = "0.4"
embedded-sdmmc = { path = "vendor/embedded-sdmmc", default-features = false }
nanomp3-core = { version = "0.2", default-features = false }
jpeg-encoder = { version = "0.7.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false }

critical-section = "1.2"
static_cell = "2"
heapless    = "0.8"
libm        = "0.2"

# Radio application tasks are opt-in so existing media firmware stays unchanged.
esp-radio = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-radio", features = ["esp32s31", "unstable"], optional = true }
embassy-net = { version = "0.9", default-features = false, features = ["medium-ethernet", "proto-ipv4", "dhcpv4", "tcp"], optional = true }
trouble-host = { version = "0.7", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool-mtu-255"], optional = true }

ieee802154 = { version = "0.6.1", optional = true }

# Pinned local Zigbee checkout; the tiny S31 port is reproduced in patches/.
zigbee = { path = "/home/nws/w/esp32/zigbee-rs-s31/zigbee", features = ["storage"], optional = true }
zigbee-mac = { path = "/home/nws/w/esp32/zigbee-rs-s31/zigbee-mac", features = ["esp32s31"], optional = true }
esp-storage = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-storage", features = ["esp32s31", "embedded-storage", "bytewise-read"], optional = true }
embassy-embedded-hal = { version = "0.6", optional = true }

[patch.crates-io]
embassy-usb = { path = "/home/nws/w/esp32/embassy-usb-host/embassy-usb" }
embassy-usb-driver = { path = "/home/nws/w/esp32/embassy-usb-host/embassy-usb-driver" }
embassy-usb-synopsys-otg = { path = "/home/nws/w/esp32/embassy-usb-host/embassy-usb-synopsys-otg" }
embassy-sync = { path = "/home/nws/w/esp32/embassy-usb-host/embassy-sync" }
esp-wifi-sys-esp32s31 = { path = "/home/nws/w/esp32/esp-rs/esp-wifi-sys-s31-classic" }
esp-hal = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-hal" }
esp-radio = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-radio" }
esp-sync = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-sync" }
esp-alloc = { path = "/home/nws/w/esp32/esp-rs/esp-hal/esp-alloc" }

[features]
default = ["usb-host"]
usb-host = ["dep:embassy-usb-host"]
usb-diagnostics = ["usb-host", "dep:log", "dep:embassy-usb-synopsys-otg", "embassy-usb-synopsys-otg/log"]
usb-device = ["dep:embassy-usb"]
radio-classic = ["dep:esp-radio", "esp-radio/classic", "esp-rtos/esp-radio"]
radio-wifi-ble = ["dep:esp-radio", "esp-radio/wifi", "esp-radio/ble", "esp-radio/coex", "esp-rtos/esp-radio", "dep:embassy-net", "dep:trouble-host"]
radio-zigbee = ["dep:zigbee", "dep:zigbee-mac", "dep:esp-storage", "dep:embassy-embedded-hal", "dep:esp-radio", "esp-radio/ieee802154", "esp-rtos/esp-radio"]
radio-802154 = ["dep:ieee802154", "dep:esp-radio", "esp-radio/ieee802154", "esp-rtos/esp-radio"]

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
